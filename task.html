<main>
    <h1>Решение алгоритмической задачи</h1>
    <form id="seat-form" action="https://httpbin.org/get" method="get" target="_blank">
        <label>Формулировка задачи
            <textarea name="formulation" rows="3" readonly>Дано: номер места в плацкартном вагоне. Определить, какое это место: верхнее или нижнее, в купе или боковое.</textarea>
        </label>
        <label for="seat">Номер места (от 1 до 54)</label>
        <input id="seat" name="seat_number" type="number" min="1" max="54" step="1" value="37" required>
        <label for="result">Результат</label>
        <input id="result" name="result" type="text" readonly value="Нажми «Определить»">
        <button id="calculate" type="button">Определить</button>
        <button type="submit">Отправить условие, номер и результат</button>
    </form>
    <p>Будем использовать стандартную схему на 54 места, т.е. нечётные - нижние, чётные - верхние; 1–36 - в купе, 37–54 - боковые</p>
</main>
